<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>invoi wordmark logo</title>
  <desc>The word "invoi" in bold lowercase, with the first and last letter i in dark green and the middle letters n, v, o in light green, bookending the wordmark symmetrically.</desc>

  <!-- Letter i (first) - dark green -->
  <g fill="#047857">
    <circle cx="140" cy="90" r="26" />
    <rect x="114" y="150" width="52" height="150" rx="10" />
  </g>

  <!-- Letter n - light green -->
  <path fill="#10b981" d="
    M 210 150
    h 52
    v 16
    c 16 -18 38 -22 58 -22
    c 46 0 62 30 62 66
    v 90
    h -52
    v -80
    c 0 -18 -8 -28 -24 -28
    c -16 0 -26 10 -26 28
    v 80
    h -70
    z
  "/>

  <!-- Letter v - light green -->
  <path fill="#10b981" d="
    M 398 150
    h 54
    l 32 92
    l 32 -92
    h 54
    l -62 150
    h -48
    z
  "/>

  <!-- Letter o - light green -->
  <g fill="#10b981">
    <path d="
      M 665 145
      c 56 0 96 40 96 80
      c 0 44 -40 80 -96 80
      c -56 0 -96 -36 -96 -80
      c 0 -40 40 -80 96 -80
      z
      M 665 195
      c -20 0 -34 14 -34 30
      c 0 18 14 30 34 30
      c 20 0 34 -12 34 -30
      c 0 -16 -14 -30 -34 -30
      z
    " fill-rule="evenodd"/>
  </g>

  <!-- Letter i (last) - dark green, bookend -->
  <g fill="#047857">
    <circle cx="835" cy="90" r="26" />
    <rect x="809" y="150" width="52" height="150" rx="10" />
  </g>
</svg>
