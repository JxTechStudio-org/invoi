<svg width="400" height="480" viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>invoi icon mark</title>
  <desc>A monogram of the lowercase letter i, made of a dark green dot and a light green stem, with a small document icon tucked behind the stem.</desc>

  <!-- Document / invoice icon, tucked behind the stem -->
  <g transform="translate(30, 190) rotate(-8)">
    <rect x="0" y="0" width="150" height="200" rx="14" fill="#10b981" fill-opacity="0.22"/>
    <rect x="28" y="40" width="94" height="10" rx="5" fill="#047857" fill-opacity="0.55"/>
    <rect x="28" y="66" width="94" height="10" rx="5" fill="#047857" fill-opacity="0.4"/>
    <rect x="28" y="92" width="64" height="10" rx="5" fill="#047857" fill-opacity="0.4"/>
    <rect x="28" y="140" width="60" height="14" rx="7" fill="#047857" fill-opacity="0.55"/>
  </g>

  <!-- Stem of the i - light green -->
  <rect x="150" y="210" width="100" height="248" rx="24" fill="#10b981"/>

  <!-- Dot of the i - dark green -->
  <circle cx="200" cy="105" r="95" fill="#047857"/>
</svg>
