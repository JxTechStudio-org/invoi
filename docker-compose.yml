name: invoiproject

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      APP_URL: ${APP_URL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/backend/uploads}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
    ports:
      - "127.0.0.1:3016:3000"
    volumes:
      - invoice_uploads:/app/backend/uploads

  postgres:
    image: postgres:16
    container_name: invoice-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    # Internal Docker port: 5432
    # Database name: defined in POSTGRES_DB inside .env

volumes:
  postgres_data:
    name: invoiproject_postgres_data
  invoice_uploads:
    # Reuse the original production project's upload volume.
    name: invoiproject_invoice_uploads
